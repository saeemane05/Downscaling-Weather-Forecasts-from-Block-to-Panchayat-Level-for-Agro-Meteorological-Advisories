<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- =========================================================
         MAPLIBRE CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            font-family:
                Inter,
                Arial,
                sans-serif;

        }


        #map {

            position: absolute;

            inset: 0;

        }


        /* =====================================================
           CONTROL PANEL
        ====================================================== */

        .control-panel {

            position: absolute;

            top: 18px;

            right: 18px;

            z-index: 100;

            width: 235px;

            padding: 14px;

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.96);

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.20);

            backdrop-filter:
                blur(10px);

        }


        .panel-title {

            font-size: 13px;

            font-weight: 800;

            margin-bottom: 7px;

            color: #17202a;

        }


        .panel-section {

            margin-bottom: 14px;

        }


        select {

            width: 100%;

            padding: 9px 10px;

            border-radius: 8px;

            border: 1px solid #d4d9dc;

            background: white;

            font-size: 13px;

            outline: none;

            cursor: pointer;

        }


        select:focus {

            border-color: #4c9aff;

        }


        /* =====================================================
           LEGEND
        ====================================================== */

        .legend {

            position: absolute;

            right: 18px;

            bottom: 22px;

            z-index: 100;

            width: 230px;

            padding: 14px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.96);

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.18);

        }


        .legend-title {

            font-size: 13px;

            font-weight: 800;

            margin-bottom: 9px;

        }


        .gradient {

            height: 13px;

            width: 100%;

            border-radius: 20px;

        }


        .legend-labels {

            display: flex;

            justify-content: space-between;

            margin-top: 5px;

            font-size: 10px;

            color: #555;

        }


        /* =====================================================
           SELECTED GP CARD
        ====================================================== */

        .selected-card {

            position: absolute;

            left: 18px;

            bottom: 22px;

            z-index: 100;

            width: 245px;

            padding: 14px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.96);

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.18);

        }


        .selected-name {

            font-weight: 800;

            font-size: 14px;

            margin-bottom: 8px;

        }


        .selected-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 7px;

        }


        .metric {

            padding: 8px;

            background: #f4f6f7;

            border-radius: 8px;

            font-size: 11px;

        }


        .metric strong {

            display: block;

            font-size: 13px;

            margin-top: 2px;

        }


        /* =====================================================
           MAP ATTRIBUTION
        ====================================================== */

        .maplibregl-ctrl-attrib {

            font-size: 9px;

        }


        /* =====================================================
           POPUP
        ====================================================== */

        .popup {

            min-width: 190px;

            font-family:
                Inter,
                Arial,
                sans-serif;

        }


        .popup-title {

            font-size: 14px;

            font-weight: 800;

            margin-bottom: 8px;

        }


        .popup-row {

            display: flex;

            justify-content: space-between;

            padding: 4px 0;

            font-size: 12px;

        }


        /* =====================================================
           MAP BUTTONS
        ====================================================== */

        .map-buttons {

            position: absolute;

            left: 18px;

            top: 18px;

            z-index: 100;

            display: flex;

            flex-direction: column;

            gap: 6px;

        }


        .map-btn {

            border: none;

            padding: 9px 12px;

            border-radius: 9px;

            background:
                rgba(255,255,255,0.94);

            box-shadow:
                0 4px 15px
                rgba(0,0,0,.16);

            cursor: pointer;

            font-size: 12px;

            font-weight: 700;

        }


        .map-btn:hover {

            background: white;

        }

    </style>
<style>
