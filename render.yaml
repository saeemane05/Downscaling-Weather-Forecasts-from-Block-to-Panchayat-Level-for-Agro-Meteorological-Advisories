services:
  - type: web
    name: hyperweather-api
    runtime: python
    # The Vite bundle is versioned in frontend/dist.  This avoids compiling
    # 2,400+ modules on Render's 512 MB web instance during a deploy.
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python frontend/server.py
    healthCheckPath: /api/locations
    envVars:
      - key: CDSAPI_URL
        sync: false
      - key: CDSAPI_KEY
        sync: false
